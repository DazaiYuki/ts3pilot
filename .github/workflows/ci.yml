name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      accept_ts3_license:
        description: 'Accept the official TeamSpeak Server license for this isolated integration run'
        required: true
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }} / php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      # Node 22 runs the TypeScript sources with the experimental type stripper;
      # Node 24 enables it by default.
      NODE_OPTIONS: ${{ matrix.node == 22 && '--experimental-strip-types' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
      - name: Print toolchain versions
        run: node --version && npm --version && php --version && composer --version
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Install PHP dependencies
        # `composer update` resolves per PHP version (PHPUnit 10/11/12);
        # the committed composer.lock targets the dev PHP version only.
        run: composer update --no-interaction --no-progress --prefer-dist --working-dir=plugins/ts3pilot-wp
      - name: Show resolved PHPUnit version
        run: composer show phpunit/phpunit --working-dir=plugins/ts3pilot-wp
      - name: Run full verification (lint, typecheck, tests, build, phpcs)
        run: npm run verify

  installer-lint:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck scripts/install.sh

  windows-verify:
    name: verify on windows (node 24 / php 8.3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Install PHP dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --working-dir=plugins/ts3pilot-wp
      - name: Print versions
        run: node --version; npm --version; php --version; composer --version
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Node tests
        run: node scripts/ci-test.mjs run test --workspace @ts3pilot/ts3-manager
      - name: PHP tests
        run: composer test --working-dir=plugins/ts3pilot-wp
      - name: Build
        run: npm run build
      - name: PHP lint
        run: php plugins/ts3pilot-wp/tests/lint-all.php
      - name: PHPCS
        working-directory: plugins/ts3pilot-wp
        run: php vendor/bin/phpcs --standard=phpcs.xml.dist src tests ts3pilot-wp.php uninstall.php

  release:
    name: release packaging
    needs: verify
    # The static pkg target is subsequently tested on maintained distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build release artifacts
        run: npm run release
      - name: Verify packaged artifacts and shell installer
        run: node scripts/ci-test.mjs run verify:release
      - name: Validate artifacts
        run: |
          test -f dist/release/ts3pilot-linux-x64-v*.tar.gz
          test -f dist/release/ts3pilot-wp-v*.zip
          echo "--- CLI tarball (first entries) ---"
          tar -tzf dist/release/ts3pilot-linux-x64-v*.tar.gz | head -n 5
          echo "--- WP zip (entry count) ---"
          unzip -l dist/release/ts3pilot-wp-v*.zip | tail -n 2
      - name: Verify binary runs on RHEL9 (glibc 2.34)
        run: |
          test -f apps/ts3-manager/dist/pkg/ts3pilot-linux-x64
          # Target: CentOS Stream 9 / RHEL9 (glibc 2.34). Rocky Linux 9 shares
          # the same baseline and is supported until 2032.
          docker run --rm -v "$PWD/apps/ts3-manager/dist/pkg:/pkg:ro" rockylinux:9 /pkg/ts3pilot-linux-x64 version
      - uses: actions/upload-artifact@v4
        with:
          name: ts3pilot-release
          path: |
            dist/release/*.tar.gz
            dist/release/*.tgz
            dist/release/*.zip
            dist/release/*.sha256
          if-no-files-found: error

  compatibility:
    name: standalone Linux compatibility
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ts3pilot-release
          path: dist/release
      - name: Extract the tested standalone binary
        run: |
          mkdir -p apps/ts3-manager/dist/pkg
          tar -xzf dist/release/ts3pilot-linux-x64-v*.tar.gz -C apps/ts3-manager/dist/pkg
          mv apps/ts3-manager/dist/pkg/ts3pilot apps/ts3-manager/dist/pkg/ts3pilot-linux-x64
          chmod 755 apps/ts3-manager/dist/pkg/ts3pilot-linux-x64
      - name: Test supported distribution images as an unprivileged user
        run: npm run test:compat
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-results
          path: dist/release/compatibility-results.json
          if-no-files-found: error

  real-integration:
    name: real TS3 and WordPress integration (explicit license acceptance)
    if: github.event_name == 'workflow_dispatch' && inputs.accept_ts3_license
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ts3pilot-release
          path: dist/release
      - name: Extract standalone binary
        run: |
          mkdir -p apps/ts3-manager/dist/pkg
          tar -xzf dist/release/ts3pilot-linux-x64-v*.tar.gz -C apps/ts3-manager/dist/pkg
          mv apps/ts3-manager/dist/pkg/ts3pilot apps/ts3-manager/dist/pkg/ts3pilot-linux-x64
          chmod 755 apps/ts3-manager/dist/pkg/ts3pilot-linux-x64
      - name: New native Ubuntu server, existing server, WordPress pairing and management
        run: node scripts/ci-test.mjs run test:integration -- --accept-eula
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: integration-results
          path: dist/release/integration-results.json
          if-no-files-found: error

  github-release:
    name: github release (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, release, compatibility]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ts3pilot-release
          path: dist/release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/ts3pilot-linux-x64-v*.tar.gz
            dist/release/ts3pilot-wp-v*.zip
            dist/release/ts3-manager-npm-v*.tgz
            dist/release/*.sha256
          generate_release_notes: true
