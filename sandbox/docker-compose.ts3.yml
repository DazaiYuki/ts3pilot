# Manual development sandbox. Accept the official TeamSpeak license explicitly.
services:
  ts3-server:
    image: teamspeak:3.13.7@sha256:4d3fa1c0db9a5a4ac69a2d07d6f0478539e464b15e7186c243a9f194bc1141fa
    restart: unless-stopped
    ports:
      - "127.0.0.1:9987:9987/udp"
      - "127.0.0.1:30033:30033"
      - "127.0.0.1:10011:10011"
    environment:
      TS3SERVER_LICENSE: ${TS3SERVER_LICENSE:?Set TS3SERVER_LICENSE=accept after reading the official license}
    volumes:
      - ts3-data:/var/ts3server
volumes:
  ts3-data:
