# 本地 TeamSpeak 3 集成测试沙盒（仅开发/CI 使用）
#
# 重要：镜像名、tag 与许可证环境变量必须对照 TeamSpeak 官方 Docker 文档
# 验证后填写。本仓库刻意不假设 "latest" 或任何固定 tag 永远可用。
#
# 使用前：
#   1. 阅读官方文档并确认镜像与许可证接受方式（例如 TS3SERVER_LICENSE）。
#   2. 更新 image/tag 与 environment，并记录验证结果到 sandbox/README.md。
#   3. docker compose -f sandbox/docker-compose.ts3.yml up -d
services:
  ts3-server:
    # TODO: 对照官方文档填入经过验证的镜像名与 tag（不要使用 unverified latest）。
    image: teamspeak:3.13.7
    container_name: ts3cops-sandbox-ts3
    restart: unless-stopped
    ports:
      - "9987:9987/udp"
      - "30033:30033"
      - "10011:10011"
      - "10022:10022"
      - "10080:10080"
      - "10443:10443"
    environment:
      # TODO: 按官方文档验证许可证接受环境变量的准确名称与取值。
      TS3SERVER_LICENSE: accept
    volumes:
      - ts3-data:/var/ts3server
volumes:
  ts3-data:
